version: '3.9'

services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: enterprise_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - mongodb
      - redis
      - chromadb
      - neo4j

  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: enterprise_frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

  postgres:

    image: postgres:16

    container_name: enterprise_postgres

    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:

    image: mongo

    container_name: enterprise_mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:

    image: redis

    container_name: enterprise_redis

    ports:
      - "6379:6379"

  chromadb:

    image: chromadb/chroma

    container_name: enterprise_chromadb

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/chroma

  neo4j:

    image: neo4j:latest

    container_name: enterprise_neo4j

    environment:
      NEO4J_AUTH: neo4j/password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

  prometheus:

    image: prom/prometheus

    container_name: enterprise_prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:

    image: grafana/grafana

    container_name: enterprise_grafana

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

volumes:

  postgres_data:

  mongo_data:

  chroma_data:

  neo4j_data: